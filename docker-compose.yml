services:
  db:
    image: mysql:8.0
    container_name: tracker_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-tracker}
      MYSQL_USER: ${DB_USER:-tracker}
      MYSQL_PASSWORD: ${DB_PASS:-tracker_secret}
      TZ: ${TZ:-Asia/Jakarta}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # ports:
    #   - "127.0.0.1:3306:3306"   # buka hanya jika butuh akses DB dari host

  app:
    build: ./docker/php
    container_name: tracker_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CI_ENV: ${CI_ENV:-development}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-tracker}
      DB_USER: ${DB_USER:-tracker}
      DB_PASS: ${DB_PASS:-tracker_secret}
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-app.ini:ro

  web:
    image: nginx:1.27-alpine
    container_name: tracker_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-127.0.0.1:3000}:80"   # host 8080 terpakai container lain (keputusan user); app: http://localhost:3000
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:

server {
    listen 80;
    server_name _;
    root /var/www/html/public;          # entrypoint = public/index.php
    index index.php;

    # Sembunyikan file tersembunyi & folder sistem
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(application|system|docker)/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        # simpan tapi selalu revalidasi via ETag (304 bila tak berubah) —
        # perubahan file statis langsung terlihat tanpa hard refresh
        add_header Cache-Control "no-cache";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
    }
}
